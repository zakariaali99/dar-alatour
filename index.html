<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF9F5" />
    <title>دار العطور | Dar Al-Atour Perfumes Company</title>
    <meta
      name="description"
      content="شركة دار العطور لاستيراد العطور ومواد الزينة — طرابلس، ليبيا. Dar Al-Atour Perfumes Company — import, supply and distribution of perfumes and cosmetics in Tripoli, Libya."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..500;1,6..72,200..400&family=IBM+Plex+Sans+Arabic:wght@200;300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('dar-alatour-theme')
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
